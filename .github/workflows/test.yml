name: SDC Compliance & Integration Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

# Runs in parallel with the image-publish workflow (build-and-publish.yml).
# Both share the same buildx GHA cache, so the second one to start reuses
# layers and gets to its real work in seconds.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load "our" versions from versions.env
        run: |
          set -a; source versions.env; set +a
          echo "FORM_MANAGER_VERSION=${FORM_MANAGER_VERSION}" >> "$GITHUB_ENV"
          echo "PRO_LIBRARY_VERSION=${PRO_LIBRARY_VERSION}" >> "$GITHUB_ENV"
          echo "PCOR_MII_VERSION=${PCOR_MII_VERSION}" >> "$GITHUB_ENV"
          # MII PRO / SDC: pinned (version + SHA) only in Dockerfile.form-manager,
          # which Renovate bumps; read here for tags and smoke-test messages.
          echo "MII_PRO_VERSION=$(grep -E '^ARG MII_PRO_VERSION=' Dockerfile.form-manager | cut -d= -f2)" >> "$GITHUB_ENV"
          RETAINED=$(sed -nE 's/^ARG MII_PRO_RETAINED_VERSIONS="?([^"]*)"?$/\1/p' Dockerfile.form-manager)
          echo "MII_PRO_RETAINED_VERSIONS=${RETAINED}" >> "$GITHUB_ENV"
          # Loader declaration: "<package>@<version>" per retained version.
          echo "RETAINED_PACKAGE_VERSIONS=$(for v in ${RETAINED}; do printf 'de.medizininformatikinitiative.kerndatensatz.pros@%s ' "$v"; done)" >> "$GITHUB_ENV"

      - name: Build form-manager image (load locally, shared GHA cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.form-manager
          load: true
          tags: fhir-sdc-form-manager:ci
          build-args: |
            FORM_MANAGER_VERSION=${{ env.FORM_MANAGER_VERSION }}
            PRO_LIBRARY_VERSION=${{ env.PRO_LIBRARY_VERSION }}
            PCOR_MII_VERSION=${{ env.PCOR_MII_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements*.txt

      - name: Install Python deps
        run: |
          cd api
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      # Known vulnerabilities in the sidecar's dependencies fail the build.
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt

      # Fast layer first: pure-function tests + loader version ordering. No
      # Docker needed, so a logic bug fails in seconds, not after the boot.
      - name: Unit tests
        run: |
          (cd api && pytest tests/unit -q)
          bash hapi-scripts/test-loader-version-order.sh

      # The real proxy image in front of a dummy backend: certificates,
      # allowlist, read-only rules, TLS policy. Seconds, no HAPI needed.
      - name: Proxy component tests
        run: python -m pytest tests/proxy -q

      - name: Start test stack (HAPI image + FastAPI sidecar)
        env:
          FORM_MANAGER_IMAGE: fhir-sdc-form-manager:ci
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for HAPI to be reachable..."
          timeout 120 bash -c 'until curl -sf http://localhost:8081/fhir/metadata -o /dev/null; do sleep 3; done'
          sleep 10

      - name: Load instance resources HAPI's installer skips
        run: |
          # Questionnaire / Library / Provenance / IG / OD are not auto-
          # installed by HAPI's PackageInstallerSvc — PUT them externally
          # against the exposed FHIR endpoint. The image's own package dir
          # is the declared content set (current + retained MII PRO, SDC,
          # PCOR-MII, PRO Library); copy it out of the container. Never mix
          # in the repo's local-packages/, which also holds stale tarballs.
          mkdir -p ./local-packages-image
          docker cp hapi-fhir-test:/data/hapi/local-packages/. ./local-packages-image/
          ls -la ./local-packages-image/

          HAPI_URL=http://localhost:8081/fhir PKGS_DIR=./local-packages-image \
            ./hapi-scripts/load-instance-resources.sh

      # The sidecar app runs IN-PROCESS (httpx ASGI transport) against the
      # HAPI container, which is what makes --cov=app measure real lines.
      # One test (test_sidecar_container.py) still hits the fastapi-test
      # container on :8001 to prove the shipped image boots.
      - name: Integration, content and upstream-behaviour tests (with coverage)
        run: |
          cd api
          pytest tests/integration/ tests/content/ tests/upstream/ \
            -v --tb=short --color=yes \
            --cov=app --cov-report=xml --cov-report=html --cov-report=term \
            --cov-fail-under=75

      # nginx front door with the committed TEST-ONLY PKI: certificate checks,
      # allowlist, FHIR routing (sidecar vs. HAPI) and the production guard.
      - name: mTLS front door (test PKI)
        env:
          # Same image as the test stack, and --no-deps: otherwise compose sees
          # a changed config and recreates HAPI (in-memory DB, content lost).
          FORM_MANAGER_IMAGE: fhir-sdc-form-manager:ci
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.mtls.yml up -d --no-deps mtls-proxy
          timeout 60 bash -c 'until curl -sk https://localhost:8443/ -o /dev/null; do sleep 2; done'
          scripts/test-mtls.sh

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            api/htmlcov/
            api/coverage.xml

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.mtls.yml logs --tail=300 || true

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml -f docker-compose.mtls.yml down -v || true

  # Deployment bundle end to end: builds the Form Manager, sidecar, loader and
  # proxy images, starts deploy/docker-compose.yml with the TEST-ONLY PKI and
  # runs the mTLS checks against it; also checks that the proxy image's default
  # (MTLS_ENV=production) refuses the test PKI.
  deploy-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (acceptance battery)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle test (build images, start, mTLS checks, acceptance battery)
        env:
          KEEP: "1"   # leave the stack up so the next step can dump its logs
        run: scripts/test-deploy-bundle.sh

      - name: Bundle logs on failure
        if: failure()
        run: docker compose -p fm-bundle-test -f deploy/docker-compose.yml logs --tail=200 || true
