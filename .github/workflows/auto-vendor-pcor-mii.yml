name: Auto-vendor PCOR-MII on Renovate PRs

on:
  pull_request:
    branches: [master, main]
    paths:
      - versions.env

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PCOR-MII package matching versions.env
        id: vendor
        run: |
          VERSION=$(grep -E '^PCOR_MII_VERSION=' versions.env | head -1 | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Fails if gh-pages has already moved past $VERSION — re-run Renovate then.
          scripts/refresh-pcor-mii.sh
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard local-packages/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(sha256sum "local-packages/pcor-mii-${VERSION}.tgz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit vendored package to PR branch
        if: steps.vendor.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "local-packages/pcor-mii-${{ steps.vendor.outputs.version }}.tgz"
          git commit -m "chore(deps): vendor PCOR-MII ${{ steps.vendor.outputs.version }}

          Downloaded from https://bih-cei.github.io/PCOR-MII/package.tgz
          to match the version bump opened by Renovate.

          SHA256: ${{ steps.vendor.outputs.sha }}"
          git push
