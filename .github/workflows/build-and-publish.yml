name: Build & Publish Form Manager Image

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fhir-sdc-form-manager

# Runs in parallel with the test workflow (test.yml). Both pipelines share
# the same buildx GHA cache, so whichever boots second reuses layers and is
# essentially a no-op at the build step.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load "our" versions from versions.env
        # Single source of truth: versions.env at repo root. Exports
        # FORM_MANAGER_VERSION + PRO_LIBRARY_VERSION into GITHUB_ENV so
        # subsequent steps can use ${{ env.VAR }} and shell ${VAR} alike.
        run: |
          set -a; source versions.env; set +a
          echo "FORM_MANAGER_VERSION=${FORM_MANAGER_VERSION}" >> "$GITHUB_ENV"
          echo "PRO_LIBRARY_VERSION=${PRO_LIBRARY_VERSION}" >> "$GITHUB_ENV"
          echo "PCOR_MII_VERSION=${PCOR_MII_VERSION}" >> "$GITHUB_ENV"
          # MII PRO / SDC: pinned (version + SHA) only in Dockerfile.form-manager,
          # which Renovate bumps; read here for tags and smoke-test messages.
          echo "MII_PRO_VERSION=$(grep -E '^ARG MII_PRO_VERSION=' Dockerfile.form-manager | cut -d= -f2)" >> "$GITHUB_ENV"
          RETAINED=$(sed -nE 's/^ARG MII_PRO_RETAINED_VERSIONS="?([^"]*)"?$/\1/p' Dockerfile.form-manager)
          echo "MII_PRO_RETAINED_VERSIONS=${RETAINED}" >> "$GITHUB_ENV"
          echo "RETAINED_PACKAGE_VERSIONS=$(for v in ${RETAINED}; do printf 'de.medizininformatikinitiative.kerndatensatz.pros@%s ' "$v"; done)" >> "$GITHUB_ENV"

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=mii-pro-${{ env.MII_PRO_VERSION }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=form-manager-${{ env.FORM_MANAGER_VERSION }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag

      - name: Build image (load to local for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.form-manager
          load: true
          tags: fhir-sdc-form-manager:ci
          build-args: |
            FORM_MANAGER_VERSION=${{ env.FORM_MANAGER_VERSION }}
            PRO_LIBRARY_VERSION=${{ env.PRO_LIBRARY_VERSION }}
            PCOR_MII_VERSION=${{ env.PCOR_MII_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python (content tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements*.txt

      - name: Install Python deps
        run: |
          cd api
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      # Smoke test = boot the freshly built image, run the post-boot loader,
      # then the content-integrity suite (api/tests/content): MII PRO current
      # + retained versions, PRO Library manifest, PCOR-MII incl. the
      # draft→active patch, and a live ValueSet/$expand. Same tests as the
      # test workflow, so PRs and the publish gate cannot drift apart.
      - name: Smoke-test image (boot, load, content tests)
        env:
          FHIR_BASE_URL: http://localhost:18095/fhir
        run: |
          docker run -d --name fm-smoketest -p 18095:8080 \
            -e spring.datasource.url=jdbc:h2:mem:testdb \
            -e spring.datasource.driverClassName=org.h2.Driver \
            -e spring.datasource.username=sa -e spring.datasource.password= \
            -e spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect \
            fhir-sdc-form-manager:ci

          echo "Waiting for HAPI to be reachable..."
          timeout 120 bash -c 'until curl -sf http://localhost:18095/fhir/metadata -o /dev/null; do sleep 3; done'
          sleep 8

          mkdir -p ./local-packages-image
          docker cp fm-smoketest:/data/hapi/local-packages/. ./local-packages-image/
          HAPI_URL=http://localhost:18095/fhir PKGS_DIR=./local-packages-image \
            ./hapi-scripts/load-instance-resources.sh

          cd api && pytest tests/content -v --tb=short --color=yes \
            || { docker logs fm-smoketest | tail -100; exit 1; }
          cd ..
          docker rm -f fm-smoketest

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (multi-arch, only on master/tag)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.form-manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FORM_MANAGER_VERSION=${{ env.FORM_MANAGER_VERSION }}
            PRO_LIBRARY_VERSION=${{ env.PRO_LIBRARY_VERSION }}
            PCOR_MII_VERSION=${{ env.PCOR_MII_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
