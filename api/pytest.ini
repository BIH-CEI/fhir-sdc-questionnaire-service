[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
asyncio_mode = auto
timeout = 120

addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Layers (see TESTING.md):
#   tests/unit         pure functions, no server          -> unit
#   tests/integration  sidecar in-process + real HAPI     -> integration
#   tests/content      the image ships what versions say  -> content
#   tests/upstream     HAPI behaviour we depend on        -> upstream
# sdc_compliance is cross-cutting: tests that map to an SDC Form Manager requirement.
markers =
    unit: pure-function tests, no FHIR server
    integration: sidecar against a running HAPI (FHIR_BASE_URL)
    content: image content integrity (packages, versions, terminology)
    upstream: pins HAPI's own behaviour; strict xfails flip when upstream changes
    sdc_compliance: maps to an SDC Form Manager CapabilityStatement requirement

# Server: FHIR_BASE_URL (default http://localhost:8081/fhir) or --fhir-url.
# Sidecar: in-process by default; API_BASE_URL switches to a running sidecar.

[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    if TYPE_CHECKING:
