# mTLS front door for the Form Manager (mounted as /etc/nginx/conf.d/default.conf).
#
# - TLS is terminated here; every client must present a certificate that
#   chains to /etc/nginx/mtls/ca.pem (bundle of trusted CAs).
# - Authentication is not authorisation: the certificate's SHA-1 fingerprint
#   must also be on /etc/nginx/mtls/allowlist.map ("<fp> <site>;"), else 403.
# - Identity is forwarded as X-Client-* headers. proxy_set_header replaces any
#   client-sent header of the same name, so clients cannot spoof them.
# - One FHIR base: the SDC operations HAPI lacks go to the sidecar, everything
#   else under /fhir/ goes to HAPI. Nothing else is exposed.
# Upstreams are resolved at startup; override via the files below if the
# service names differ (test stack: hapi-fhir-test / fastapi-test).

map $ssl_client_fingerprint $client_site {
    default "";
    include /etc/nginx/mtls/allowlist.map;
}

# nginx has no escape for a literal "$" in strings; this variable holds one.
geo $dollar {
    default "$";
}

upstream hapi    { server ${HAPI_UPSTREAM}; }
upstream sidecar { server ${SIDECAR_UPSTREAM}; }

log_format mtls '$remote_addr site="$client_site" fp=$ssl_client_fingerprint '
                'verify=$ssl_client_verify "$request" $status $body_bytes_sent';

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate         /etc/nginx/mtls/server.pem;
    ssl_certificate_key     /etc/nginx/mtls/server.key;
    ssl_client_certificate  /etc/nginx/mtls/ca.pem;
    ssl_verify_client       on;
    ssl_verify_depth        3;
    ssl_protocols           TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log mtls;
    default_type application/fhir+json;

    # 496: no client certificate, 495: certificate invalid / untrusted CA
    error_page 495 496 = @cert_rejected;
    location @cert_rejected {
        return 401 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"login","diagnostics":"A client certificate issued by a trusted CA is required"}]}';
    }

    proxy_set_header Host                       $host;
    proxy_set_header X-Forwarded-Proto          https;
    proxy_set_header X-Client-Site              $client_site;
    proxy_set_header X-Client-Cert-Fingerprint  $ssl_client_fingerprint;
    proxy_set_header X-Client-Cert-Subject      $ssl_client_s_dn;
    proxy_read_timeout 120s;

    # Valid certificate, but this site is not allowlisted.
    if ($client_site = "") {
        return 403 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"forbidden","diagnostics":"Client certificate is not on the allowlist"}]}';
    }

    # SDC operations served by the sidecar (/api/questionnaires/...)
    location ~ "^/fhir/Questionnaire/([^/]+)/\$(package|localize|languages|compute-and-extract)$" {
        proxy_pass http://sidecar/api/questionnaires/$1/${dollar}$2$is_args$args;
    }
    location ~ "^/fhir/Questionnaire/\$(package|localize)$" {
        proxy_pass http://sidecar/api/questionnaires/${dollar}$1$is_args$args;
    }

    location /fhir/ {
        proxy_pass http://hapi;
    }

    location / {
        return 404 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"not-found","diagnostics":"Only /fhir/ is served"}]}';
    }
}
