id: bih-cei.fhir.sdc-form-manager
canonical: https://bih-cei.github.io/fhir-sdc-questionnaire-service
name: SDCFormManager
title: FHIR SDC Form Manager
description: >-
  API contract, content, access model, deployment and maintenance of the
  BIH-CEI FHIR SDC Form Manager (HAPI FHIR with SDC, MII PRO, PRO Library and
  PCOR-MII content, plus a sidecar for CRMI $package, $localize and
  $compute-and-extract).
status: draft
version: 0.2.0
fhirVersion: 4.0.1
