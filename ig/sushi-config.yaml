publisher:
  name: Berlin Institute of Health at Charité (BIH-CEI)
  url: https://www.bihealth.org/

dependencies:
  hl7.fhir.uv.sdc: 4.0.0
  hl7.fhir.uv.crmi: 2.0.0

parameters:
  show-inherited-invariants: false
  usage-stats-opt-out: true

